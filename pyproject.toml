[project]
name = "arc-env"
version = "0.1.0"
description = "Procedurally generated ARC-AGI style RL environment with multi-turn feedback"
requires-python = ">=3.9"
dependencies = ["numpy", "requests", "anthropic"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["arc_env*"]
